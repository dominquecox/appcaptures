<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>News — AppCaptures</title>
<meta name="theme-color" content="#f5f5f7" />
<link rel="manifest" href="/manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="AppCaptures" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="description" content="AppCaptures news: launches, templates, and release notes." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Hanken+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f5f7;--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--accent:#1d1d1f;--card:#fff}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.6 Inter,ui-sans-system,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.prose{max-width:720px}
header.site{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:8px 22px;min-height:60px;flex-wrap:wrap;padding:10px 0}
.brand{font:800 17px "Hanken Grotesk",Inter,sans-serif;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.brand span{color:var(--accent)}
.nav nav{display:flex;gap:18px;margin-left:8px}
.nav nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px}
.nav nav a:hover{color:var(--ink)}
.nav .cta{margin-left:auto;display:flex;gap:10px}
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:#333336}
@media(max-width:640px){
.nav{min-height:0;padding:12px 0}
.nav nav{display:none}
}
h1{font:800 clamp(28px,4vw,40px)/1.05 "Hanken Grotesk",Inter,sans-serif;letter-spacing:-.02em;margin:36px 0 6px}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0}
article h2{margin:0 0 4px;font-size:18px}
article time{font-size:12px;color:var(--muted);font-weight:700}
article p{margin:8px 0 0;color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:40px;padding:20px 0 40px;color:var(--muted);font-size:13px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* legal-links */
footer.site .wrap{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center}
footer.site a{display:inline-flex;align-items:center;min-height:44px}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.band .fine a{color:#fff}
</style>
</head>
<body>
<header class="site"><div class="wrap nav"><a class="brand" href="/">App<span>Captures</span></a><nav><a href="/news/">News</a><a href="/changelog/">Changelog</a></nav><span class="cta"><a class="btn" href="/#waitlist">Join waitlist</a></span></div></header>
<main class="wrap prose"><h1>News</h1><div id="list"></div></main>
<footer class="site"><div class="wrap">
<span>© 2026 AppCaptures · Ploonu LLC</span>
<a href="/">Home</a><a href="/news/">News</a><a href="/changelog/">Changelog</a>
<a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/support">Support</a>
<a href="/support#remove-email">Remove my email</a><a href="mailto:support@appcaptures.com">support@appcaptures.com</a>
</div></footer>
<script>
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
fetch("/data/news.json").then(r=>r.json()).then(j=>{
  const ov=JSON.parse(localStorage.getItem("appcaptures_news_override")||"null");
  const items=(ov&&ov.items)||j.items||[];
  document.getElementById("list").innerHTML=items.map(n=>`<article><h2>${esc(n.title)}</h2><time>${esc(n.date)}</time><p>${esc(n.summary)}</p></article>`).join("")||"<p>No posts yet.</p>";
}).catch(()=>{ document.getElementById("list").innerHTML="<p>Couldn't load news — check back soon.</p>"; });
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})})}</script>
</body>
</html>
